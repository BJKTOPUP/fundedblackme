<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Funded - Crypto Payment</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card-bg: #161c28;
      --border: #262f40;
      --accent: #10b981;
      --accent-hover: #059669;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .payment-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .network-selector {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .net-btn {
      flex: 1;
      padding: 0.75rem;
      background: #0d1117;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .net-btn.active {
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent);
    }

    .qr-container {
      background: #fff;
      padding: 1rem;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 1.5rem;
    }

    .qr-container img {
      width: 180px;
      height: 180px;
      display: block;
    }

    .address-box {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem;
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .address-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.25rem;
    }

    .address-value {
      font-family: monospace;
      font-size: 0.85rem;
      word-break: break-all;
      color: #fff;
    }

    .copy-btn {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .copy-btn:hover {
      background-color: var(--accent-hover);
    }

    .notice {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: #ef4444;
    }
  </style>
</head>
<body>

  <div class="payment-card">
    <h1>Black Funded</h1>
    <p class="subtitle">Complete your payment via Crypto</p>

    <!-- Network Selection -->
    <div class="network-selector">
      <button class="net-btn active" id="btn-polygon" onclick="setNetwork('Polygon')">Polygon</button>
      <button class="net-btn" id="btn-bep20" onclick="setNetwork('BEP20')">BEP20 (BSC)</button>
    </div>

    <!-- Dynamic QR Code -->
    <div class="qr-container">
      <img id="qr-code" src="" alt="Payment QR Code" />
    </div>

    <!-- Deposit Address Display -->
    <div class="address-box">
      <div class="address-label" id="network-label">Polygon Deposit Address</div>
      <div class="address-value" id="wallet-address">0x04ce74796ecf97ec9760ff986bd703affa0aaa3f</div>
    </div>

    <!-- Copy Button -->
    <button class="copy-btn" id="copy-btn" onclick="copyAddress()">Copy Address</button>

    <p class="notice">⚠️ Send only supported tokens (USDT) on the selected network.</p>
  </div>

  <script>
    const walletAddress = "0x04ce74796ecf97ec9760ff986bd703affa0aaa3f";

    function updateQR() {
      const qrImg = document.getElementById("qr-code");
      qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${walletAddress}`;
    }

    function setNetwork(network) {
      const btnPolygon = document.getElementById("btn-polygon");
      const btnBep20 = document.getElementById("btn-bep20");
      const networkLabel = document.getElementById("network-label");

      if (network === 'Polygon') {
        btnPolygon.classList.add("active");
        btnBep20.classList.remove("active");
        networkLabel.innerText = "Polygon Deposit Address";
      } else {
        btnBep20.classList.add("active");
        btnPolygon.classList.remove("active");
        networkLabel.innerText = "BEP20 (BSC) Deposit Address";
      }
    }

    function copyAddress() {
      navigator.clipboard.writeText(walletAddress).then(() => {
        const btn = document.getElementById("copy-btn");
        btn.innerText = "Copied!";
        setTimeout(() => {
          btn.innerText = "Copy Address";
        }, 2000);
      });
    }

    // Initialize QR Code on load
    updateQR();
  </script>

</body>
</html>
